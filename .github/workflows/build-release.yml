name: Build & Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from build.gradle.kts
        id: version
        run: |
          VERSION=$(grep -E '^\s*versionName\s*=' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION (tag: v$VERSION)"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "cmake;3.22.1"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        run: |
          base64 -d .github/release-keystore.b64 > release.keystore
          test -s release.keystore && echo "Keystore decoded OK ($(stat -c%s release.keystore) bytes)" || { echo "Failed to decode keystore"; exit 1; }

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: android
          KEY_ALIAS: release
          KEY_PASSWORD: android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: Prepare artifacts
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "Found APK: $APK_PATH"
          cp "$APK_PATH" "RootMyGalaxy-${TAG}.apk"
          sha256sum "RootMyGalaxy-${TAG}.apk" > "RootMyGalaxy-${TAG}.apk.sha256"
          echo "## APK Build Info" >> $GITHUB_STEP_SUMMARY
          echo "- File: \`RootMyGalaxy-${TAG}.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "- Size: $(du -h RootMyGalaxy-${TAG}.apk | cut -f1)" >> $GITHUB_STEP_SUMMARY
          echo "- SHA256: \`$(cut -d' ' -f1 RootMyGalaxy-${TAG}.apk.sha256)\`" >> $GITHUB_STEP_SUMMARY

      - name: Delete existing release and tag if present
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking for existing release with tag $TAG..."
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null && echo "Deleted existing release and tag." || echo "No existing release found, proceeding."
          # Also ensure the tag is gone from remote (in case release was deleted but tag lingered)
          git push --delete origin "$TAG" 2>/dev/null && echo "Deleted lingering remote tag." || echo "No lingering remote tag."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            RootMyGalaxy-*.apk
            RootMyGalaxy-*.apk.sha256
